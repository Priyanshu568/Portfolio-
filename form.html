<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Message Status | Priyanshu Bhatta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .form-page-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      position: relative;
      z-index: 2;
    }

    .status-card {
      max-width: 560px;
      width: 100%;
      background: rgba(13, 19, 36, 0.82);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 24px;
      padding: 2.75rem 2.25rem;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55), 0 0 40px rgba(56, 189, 248, 0.12);
      animation: cardPopIn 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardPopIn {
      0% { opacity: 0; transform: translateY(28px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .check-circle {
      width: 76px;
      height: 76px;
      margin: 0 auto 1.5rem;
      border-radius: 50%;
      background: rgba(52, 211, 153, 0.12);
      border: 1px solid rgba(52, 211, 153, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px rgba(52, 211, 153, 0.25);
    }

    .check-circle svg path {
      stroke-dasharray: 48;
      stroke-dashoffset: 48;
      animation: drawCheck 0.7s 0.25s ease forwards;
    }

    @keyframes drawCheck {
      to { stroke-dashoffset: 0; }
    }

    .status-card h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.9rem;
      margin-bottom: 0.75rem;
    }

    .status-card p {
      color: #94a3b8;
      line-height: 1.65;
      margin-bottom: 1.75rem;
    }

    .action-row {
      display: flex;
      gap: 0.9rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .standalone-section {
      margin-top: 2rem;
      padding-top: 1.75rem;
      border-top: 1px solid rgba(148, 163, 184, 0.15);
      text-align: left;
    }

    .standalone-section h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.2rem;
      margin-bottom: 1rem;
      color: #e2e8f0;
    }
  </style>
</head>
<body>
  <canvas id="neuralCanvas" aria-hidden="true"></canvas>

  <main class="form-page-wrapper">
    <div class="status-card spotlight-card">
      <div class="check-circle">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6L9 17l-5-5" />
        </svg>
      </div>

      <span class="section-tag">NETLIFY TRANSMISSION CONFIRMED</span>
      <h1>Message Received!</h1>
      <p>
        Thank you for reaching out to <strong>Priyanshu Bhatta</strong>. Your inquiry has been logged via Netlify Forms, and I will respond shortly at your provided email address.
      </p>

      <div class="action-row">
        <a href="index.html" class="btn btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          <span>Back to Portfolio</span>
        </a>
        <a href="https://www.linkedin.com/in/priyanshubhatta69" target="_blank" rel="noopener noreferrer" class="btn btn-secondary">
          <span>Connect on LinkedIn</span>
        </a>
      </div>

      <!-- Standalone fallback form if someone visits /form.html directly -->
      <div class="standalone-section" id="directFormBox">
        <h2>Send Another Direct Note</h2>
        <form
          name="contact-direct"
          method="POST"
          action="/form.html"
          data-netlify="true"
          netlify-honeypot="bot-field"
          class="contact-form"
        >
          <input type="hidden" name="form-name" value="contact-direct" />
          <p class="sr-only" aria-hidden="true">
            <label>Don't fill this out: <input name="bot-field" /></label>
          </p>
          <div class="form-group">
            <label for="directName">Your Name</label>
            <input type="text" id="directName" name="name" placeholder="Enter your name" required />
          </div>
          <div class="form-group">
            <label for="directEmail">Email</label>
            <input type="email" id="directEmail" name="email" placeholder="you@domain.com" required />
          </div>
          <div class="form-group">
            <label for="directMsg">Message</label>
            <textarea id="directMsg" name="message" rows="3" placeholder="Write your message..." required></textarea>
          </div>
          <button type="submit" class="btn btn-secondary btn-full">Send Direct Message</button>
        </form>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
